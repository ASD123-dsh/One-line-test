# 仅执行 Python 源码回归，不编译 EXE，不推送源码，不发布 GitHub Release。
name: Windows source checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check source tracking, syntax and regression tests
        run: python -B tools/check_project.py --require-tracked
